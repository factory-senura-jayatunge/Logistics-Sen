[project]
name = "acme-logistics-backend"
version = "0.1.0"
description = "Enterprise logistics management platform API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
    "N",      # pep8-naming (naming conventions)
    "PLR0915", # pylint: too-many-statements (large functions)
]
ignore = ["E501"]

[tool.ruff.lint.pylint]
# Flag functions that have grown beyond ~100 statements (pylint default is 50).
# This keeps individual units small enough for humans and AI agents to reason
# about. Complements the repo-level byte/line-count check in
# scripts/check-file-size.sh.
max-statements = 100

[tool.ruff.lint.per-file-ignores]
# seed.py is a one-shot database seeder that inherently contains many
# sequential insert statements. Splitting it purely to appease the linter
# would hurt readability, so the rule is disabled for that file only.
"seed.py" = ["PLR0915"]
"tests/**" = ["PLR0915"]

[tool.ruff.lint.pep8-naming]
# Enforce PEP 8 naming conventions:
# - snake_case for functions, methods, variables
# - PascalCase for classes
# - UPPER_CASE for constants
classmethod-decorators = ["classmethod", "pydantic.validator", "pydantic.field_validator"]
staticmethod-decorators = ["staticmethod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --durations=10 --cov=app --cov-report=term-missing --cov-fail-under=80 -p randomly"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
