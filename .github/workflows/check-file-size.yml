name: Check File Size

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-file-size:
    name: Detect overly large files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan every tracked file against size thresholds
        run: ./scripts/check-file-size.sh --all
