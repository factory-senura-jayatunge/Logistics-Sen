name: Bug Report
description: Report a bug in the Acme Logistics platform
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce and fix it.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the platform is affected?
      options:
        - Frontend (Next.js / React UI)
        - Backend (FastAPI / API)
        - Database / Data Layer
        - CI / Build Pipeline
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error messages, stack traces, or attach screenshots.
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low - cosmetic or minor inconvenience
        - Medium - feature partially broken
        - High - feature completely broken
        - Critical - data loss or security issue
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node/Python version, or any other relevant environment details.
      placeholder: |
        Browser: Chrome 120
        OS: macOS 14
        Node: 20.x
