# Priority labels — severity / urgency for triage
- name: "priority: P0"
  color: "b60205"
  description: "Critical – service down or data loss, immediate action required"
- name: "priority: P1"
  color: "d93f0b"
  description: "High – major feature broken, needs fix within 24 hours"
- name: "priority: P2"
  color: "fbca04"
  description: "Medium – degraded experience, fix within the current sprint"
- name: "priority: P3"
  color: "0e8a16"
  description: "Low – minor issue or nice-to-have, schedule when convenient"

# Type labels — what kind of work this is
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working as expected"
- name: "type: feature"
  color: "0075ca"
  description: "New feature or capability request"
- name: "type: chore"
  color: "c5def5"
  description: "Maintenance, refactoring, or tooling improvements"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation improvements or additions"
- name: "type: test"
  color: "bfd4f2"
  description: "Adding or improving tests"

# Area labels — which part of the codebase is affected
- name: "area: frontend"
  color: "7057ff"
  description: "Next.js / React frontend application"
- name: "area: backend"
  color: "1d76db"
  description: "FastAPI / Python backend application"
- name: "area: infra"
  color: "006b75"
  description: "CI/CD, deployment, Docker, or infrastructure"
- name: "area: database"
  color: "5319e7"
  description: "Database schema, migrations, or seed data"
- name: "area: api"
  color: "0e8a16"
  description: "API contracts, endpoints, or integrations"
